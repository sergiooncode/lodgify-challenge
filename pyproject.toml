[project]
name = "lodgify-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio", email = "sperez4mba@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "inspect-ai>=0.3.258",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", ".venv", "logs"]

[tool.mutmut]
source_paths = ["src/lodgify_challenge"]
